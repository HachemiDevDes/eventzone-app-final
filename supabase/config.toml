# static_files = [ "./functions/send-notification/*.html" ]

[functions.trial-reminders]
verify_jwt = false
import_map = "./functions/trial-reminders/deno.json"
entrypoint = "./functions/trial-reminders/index.ts"

[functions.trial-reminders.schedule]
